[project]
name = "frontend"
version = "0.1.0"
description = "AI Applications Chassis - AI Apps Best Practices Tailored for Azure - Frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-agents>=1.1.0b1",
    "azure-ai-inference>=1.0.0b9",
    "azure-ai-projects>=1.0.0b11",
    "azure-core-tracing-opentelemetry>=1.0.0b12",
    "azure-monitor-opentelemetry-exporter>=1.0.0b38",
    "azure-monitor-opentelemetry>=1.6.10",
    "chainlit>=2.5.5",
    "opentelemetry-exporter-otlp-proto-grpc>=1.31.1",
    "opentelemetry-instrumentation-openai-v2>=2.1b0",
    "opentelemetry-instrumentation>=0.52b1",
    "opentelemetry-sdk>=1.31.1",
    "python-dotenv ~=1.0.1",
    "rich>=14.0.0",
    "semantic-kernel>=1.35.2",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = ["./"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.1",
    "rich>=14.0.0",
]
